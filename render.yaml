services:
  - type: web
    name: ce-liar-game
    runtime: node
    # 永続ディスクは有料プラン（Starter以上）が必要。Freeだとスリープ・再起動で状態が消える
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false   # Renderダッシュボードで必ず手動設定すること（8文字以上。未設定だと起動しない）
      - key: STATE_FILE
        value: /var/data/game-state.json
    disk:
      name: game-state
      mountPath: /var/data
      sizeGB: 1
